[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Single-page app: every path serves index.html.
# Function routes (/.netlify/functions/*) are matched before redirects,
# so this does not swallow them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "gate"
  path = "/*"
